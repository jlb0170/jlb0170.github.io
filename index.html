<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toys</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #07090d; color: #9aa4b2;
    font: 14px/1.6 "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 6vh 20px;
  }
  main { max-width: 680px; width: 100%; }
  h1 { color: #e6edf3; font-size: 20px; letter-spacing: 8px; font-weight: 600; }
  .sub { color: #565d66; margin: 4px 0 34px; font-style: italic; }
  .tabs { display: flex; gap: 26px; margin-bottom: 16px; border-bottom: 1px solid #21262e; }
  .tabs a {
    color: #565d66; font-size: 11px; letter-spacing: 4px; font-weight: 600; text-decoration: none;
    padding: 12px 0; margin-bottom: -1px; border-bottom: 1px solid transparent;
  }
  .tabs a:hover { color: #8b949e; }
  .tabs a.on { color: #e6edf3; border-bottom-color: #8b949e; }
  .panel { display: none; }
  .panel.on { display: block; }
  .credit { color: #565d66; font-size: 11px; margin-top: 6px; }
  .toy {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid #21262e; background: #0b0e14;
    padding: 18px 22px; margin-bottom: 14px;
    transition: border-color 0.15s;
  }
  .toy:hover { border-color: #8b949e; }
  .toy h2 { font-size: 14px; letter-spacing: 3px; margin-bottom: 6px; }
  .toy p { color: #8b949e; font-size: 13px; }
  .toy .go { color: #565d66; font-size: 12px; margin-top: 8px; }
  .toy:hover .go { color: #c8d0da; }
  footer { color: #3a4048; font-size: 12px; margin-top: 30px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>T O Y S</h1>
  <div class="sub">small worlds, left running. none of them need you.</div>
  <nav class="tabs">
    <a href="#idlers" data-tab="idlers">IDLERS</a>
    <a href="#demos" data-tab="demos">GAME DEMOS</a>
  </nav>
  <div id="cards-idlers" class="panel"></div>
  <div id="cards-demos" class="panel"></div>
  <footer>descriptions live inside each toy — this page just asks them</footer>
</main>
<script>
// each toy OWNS its manifest: /​<toy>-play/toy.json ships with its build.
// This page fetches them at runtime — deploying a toy updates the hub.
const TOYS = [
  { id: "derelict", hue: "#8a6fd0", section: "cards-idlers" },
  { id: "corridors", hue: "#d4a24c", section: "cards-idlers" },
  { id: "dirtball", hue: "#ce8a40", section: "cards-idlers" },
  { id: "seep",     hue: "#4aa8c0", section: "cards-idlers" },
  { id: "shelterz", hue: "#a03028", section: "cards-idlers" },
  { id: "firehouse-rl", hue: "#e05a3a", section: "cards-demos" },
  { id: "remaind3r", hue: "#00ff41", section: "cards-demos" },
  // lives on jeffbloke.com beside its scoreboard, over http, so this https page can't ask it: linked, its text kept here
  { id: "gomarine", hue: "#8fbf4a", section: "cards-demos", href: "http://jeffbloke.com/gomarine/" },
];
// guests: not part of the toy.json federation — a static card, credited
const GUESTS = [
  {
    id: "rogue-arena", name: "ROGUE ARENA", hue: "#c8b45a", section: "cards-demos",
    blurb: "A ROT.js roguelike grown from the classic RogueBasin tutorial and heavily mutated.",
    href: "https://jlb0170.github.io/rogue-arena/",
    go: "> enter",
    credit: "written by gideon-s · collaborated on",
  },
];
const FALLBACK = {
  "derelict": ["DERELICT", "A ship that died a long time ago, and the things that refuse to agree about what that means."],
  "corridors": ["CORRIDORS OF BATTLE", "A war terrarium: squads of five fight over ruined dioramas cut to your screen. Nothing in it needs you."],
  "dirtball": ["DIRTBALL", "A contested planet under constant bombardment. The only failure state is boredom."],
  "seep": ["SEEP", "A wall in cross-section, slowly coming apart. Breakthrough is not an ending."],
  "shelterz": ["SHELTERZ", "A zombie survival story machine. Named runners cross town, bleed, and turn; the streets keep the score in blood."],
  "firehouse-rl": ["FIREHOUSE RL", "A firefighting roguelike: a building that burns faster than orders travel."],
  "remaind3r": ["REMAIND3R", "A wave defense in falling digits: build launchers out from your core, fire the clusters they hold, rebuild while it rains."],
  "gomarine": ["GO MARINE", "A two-handed defense: one hand drops walls as tetris pieces, the other drops whatever the pod holds — marine, flag or enemy. It escalates until you're overwhelmed; the scoreboard keeps who lasted."],
};
const onPages = location.hostname.endsWith("github.io");
const playUrl = (id) => {
  if (onPages) return `/${id}-play/`;
  if (id === "derelict") return "/derelict/"; // prod hosts derelict natively
  return `https://jlb0170.github.io/${id}-play/`;
};
const manifestUrl = (id) => {
  if (onPages) return `/${id}-play/toy.json`;
  if (id === "derelict") return "/derelict/toy.json";
  return `https://jlb0170.github.io/${id}-play/toy.json`; // Pages sends CORS *
};
for (const t of TOYS) {
  const a = document.createElement("a");
  a.className = "toy";
  a.href = t.href ?? playUrl(t.id);
  const [fn, fb] = FALLBACK[t.id];
  a.innerHTML = `<h2 style="color:${t.hue}">${fn}</h2><p>${fb}</p><div class="go">&gt; enter</div>`;
  document.getElementById(t.section).appendChild(a);
  if (t.href) continue;
  fetch(manifestUrl(t.id)).then(r => r.ok ? r.json() : null).then(m => {
    if (!m) return;
    a.querySelector("h2").textContent = m.name;
    a.querySelector("p").textContent = m.blurb;
  }).catch(() => {});
}
for (const g of GUESTS) {
  const a = document.createElement("a");
  a.className = "toy";
  a.href = g.href;
  a.innerHTML = `<h2 style="color:${g.hue}">${g.name}</h2><p>${g.blurb}</p><div class="credit">${g.credit}</div><div class="go">${g.go.replace(">", "&gt;")}</div>`;
  document.getElementById(g.section).appendChild(a);
  if (g.id) {
    // guests can join the manifest federation too
    fetch(`https://jlb0170.github.io/${g.id}/toy.json`).then(r => r.ok ? r.json() : null).then(m => {
      if (!m) return;
      a.querySelector("h2").textContent = m.name;
      a.querySelector("p").textContent = m.blurb;
    }).catch(() => {});
  }
}
// one tab showing at a time; the address's #idlers or #demos picks it, so a link can open either
const TABS = ["idlers", "demos"];
const showTab = () => {
  const asked = location.hash.slice(1);
  const tab = TABS.includes(asked) ? asked : TABS[0];
  for (const t of TABS) {
    document.querySelector(`.tabs a[data-tab="${t}"]`).classList.toggle("on", t === tab);
    document.getElementById(`cards-${t}`).classList.toggle("on", t === tab);
  }
};
addEventListener("hashchange", showTab);
showTab();
</script>
</body>
</html>
